    window.tailwind = { config: { theme: { extend: { colors: {
      emerald: { 50:'#eff8f4',100:'#d9eee4',200:'#b4ddca',300:'#83c3a8',400:'#4da581',500:'#046B50',600:'#046B50',700:'#064E3B',800:'#064E3B',900:'#033c2e' },

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- DESIGN TOKENS -->
  <style>
    :root {
      --emerald:#046B50; --deep:#064E3B; --mist:#F1F3F2; --gold:#B08D57;
      --white:#fff; --ink:#202925; --muted:#77817C; --line:rgba(6,78,59,.1);

      --success:#24734d; --warning:#8b641f; --danger:#a43e3e; --info:#3c688a;
      --school-primary:#046B50; --school-secondary:#B08D57; --school-tint:#eff8f4;
      --shadow-1:0 2px 8px rgba(6,78,59,.05); --shadow-2:0 8px 24px rgba(6,78,59,.08); --shadow-3:0 18px 48px rgba(6,78,59,.11); --shadow-4:0 30px 80px rgba(6,78,59,.15);
      --r8:8px; --r12:12px; --r16:16px; --r24:24px;
      --dur-instant:90ms; --dur-fast:160ms; --dur-base:260ms; --dur-slow:420ms; --dur-hero:700ms;
      --ease-out:cubic-bezier(.22,1,.36,1); --ease-in-out:cubic-bezier(.65,0,.35,1); --ease-in:cubic-bezier(.5,0,.75,0); --ease-spring:cubic-bezier(.34,1.3,.64,1);
      --rise-sm:8px; --rise-md:16px; --rise-lg:28px; --gutter:clamp(20px,5vw,76px);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink); background:var(--white); scroll-behavior:smooth;
    }
    /* BASE & UTILITIES */
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-width:320px;line-height:1.6;background:#fff;color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit} button{cursor:pointer} a{color:inherit;text-decoration:none}
    img,svg{max-width:100%} svg{vertical-align:middle}
    h1,h2,h3,h4{font-family:"Plus Jakarta Sans",Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.04em;line-height:1.14;margin:0;color:var(--deep)}
    p{margin:0 0 16px} .muted{color:var(--muted)} .small{font-size:12px} .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--emerald)}
    .wrap{width:min(1200px,calc(100% - 2*var(--gutter)));margin-inline:auto}
    .skip{position:fixed;z-index:999;top:8px;left:8px;transform:translateY(-150%);padding:12px 18px;background:#fff;border-radius:8px;box-shadow:var(--shadow-2)}.skip:focus{transform:none}
    :focus-visible{outline:2px solid var(--emerald);outline-offset:3px}
    .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:10px 17px;border:1px solid transparent;border-radius:10px;font-weight:650;font-size:13px;transition:transform var(--dur-fast) var(--ease-out),background var(--dur-fast),border-color var(--dur-fast),box-shadow var(--dur-fast);white-space:nowrap}
    .btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .btn-primary{background:var(--emerald);color:#fff;box-shadow:0 5px 14px rgba(4,107,80,.16)}.btn-primary:hover{background:var(--deep)}
    .btn-secondary{background:#fff;color:var(--deep);border-color:var(--line)}.btn-secondary:hover{border-color:rgba(4,107,80,.3);background:var(--e50)}
    .btn-ghost{background:transparent;color:var(--deep)}.btn-ghost:hover{background:var(--e50)}
    .btn-dark{background:var(--deep);color:#fff}.btn-danger{background:#fff1f0;color:var(--danger);border-color:#f3d6d2}
    .icon-btn{height:42px;width:42px;padding:0;display:inline-grid;place-items:center;border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:10px}
    .card{border:1px solid var(--line);border-radius:var(--r16);background:#fff;box-shadow:var(--shadow-1)}
    .field{display:grid;gap:7px}.field label,.field-label{font-size:12px;font-weight:650;color:#48544e}
    .input,.select,.textarea{width:100%;min-height:46px;padding:11px 13px;border:1px solid rgba(6,78,59,.16);border-radius:10px;background:#fff;color:var(--ink);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
    .input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(4,107,80,.1)}

    .pill.gold{background:#f5efe5;color:#725426}.pill.warning{background:#fff5df;color:#76551b}.pill.danger{background:#fff0ef;color:#963a36}.pill.success{background:#eaf5ee;color:#27633f}

    .section-dark::before,.dark-texture::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(120deg,#000,transparent 85%)}
    .section-title{font-size:clamp(30px,4.5vw,54px);max-width:760px}.section-lead{max-width:600px;color:var(--muted);margin-top:16px}

    /* MOTION SYSTEM */
    [data-reveal]{opacity:1;transform:none}
    .js [data-reveal]:not(.revealed){opacity:0;transform:translateY(var(--rise-sm));}
    .js [data-reveal="fade"]:not(.revealed){transform:none}
    .js [data-reveal="scale-in"]:not(.revealed){transform:scale(.97)}
    .js [data-reveal="slide-left"]:not(.revealed){transform:translateX(16px)}
    .js [data-reveal="slide-right"]:not(.revealed){transform:translateX(-16px)}
    [data-reveal].revealed{opacity:1;transform:none;transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out)}
    @keyframes shimmer{to{transform:translateX(100%)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes float{50%{transform:translateY(-6px)}}
    @keyframes pop{50%{transform:scale(1.04)}}
    .is-paused{animation-play-state:paused!important}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.js [data-reveal]:not(.revealed){opacity:1;transform:none}}
    /* COMPONENT STYLES */

    .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -20%,rgba(131,195,168,.2),transparent 56%);pointer-events:none}

    .trustline{margin-top:21px;font-size:11px;color:var(--muted)}

    @keyframes hero-in{from{opacity:0;transform:translateY(30px) scale(.98);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}

    .mock-side{background:var(--deep);padding:20px 14px;color:#effaf4}.mock-side .brand{font-size:13px;color:#fff;margin-bottom:28px}.mock-side .crest{width:28px;height:28px;background:rgba(255,255,255,.12)}
    .mock-nav{font-size:10px;opacity:.66;padding:8px 9px;border-radius:7px;margin:4px 0}.mock-nav.active{opacity:1;background:rgba(255,255,255,.13)}
    .mock-main{background:#f8faf9;padding:23px;min-width:0}.mock-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .mock-heading b{font:700 15px "Plus Jakarta Sans";color:var(--deep)}.mock-heading span{font-size:9px;color:#718079}
    .mock-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mock-stat{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}.mock-stat small{font-size:9px;color:#77817c}.mock-stat strong{display:block;font:700 19px "Plus Jakarta Sans";margin-top:3px;color:var(--deep)}
    .mock-lower{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;margin-top:11px}.mock-panel{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:135px}.mock-panel b{font-size:10px;color:var(--deep)}
    .mock-chart{height:79px;width:100%;margin-top:7px}.mock-feed{display:grid;gap:9px;margin-top:12px}.mock-feed div{display:flex;justify-content:space-between;font-size:9px;color:#69766f;border-bottom:1px solid #eef2ef;padding-bottom:7px}
    .float-note{position:absolute;right:-18px;top:19%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow-2);font-size:11px;animation:float 6s ease-in-out infinite}
    .float-note.second{right:auto;left:-22px;top:auto;bottom:18%;animation-delay:-3s}
    .feature-card{padding:23px;min-height:190px;transition:transform var(--dur-fast),border-color var(--dur-fast)}.feature-card:hover{transform:translateY(-3px);border-color:rgba(4,107,80,.25)}

    .step{padding:24px;border-top:1px solid var(--line)}.step-num{font:700 12px "Plus Jakarta Sans";color:var(--gold);margin-bottom:15px}
    .price-card{padding:26px;position:relative;overflow:hidden}.price-card.recommended{border-color:rgba(176,141,87,.6);box-shadow:0 10px 36px rgba(176,141,87,.12)}
    .price{font:800 34px "Plus Jakarta Sans";color:var(--deep);margin:17px 0}.price small{font:500 12px Inter;color:var(--muted)}
    .price-card ul{list-style:none;margin:18px 0 24px;padding:0;color:#5e6b64;font-size:13px}.price-card li{padding:6px 0}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .span-2{grid-column:span 2}

    /* SVG SPRITE */
    .ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
    /* HTML SHELLS */
    #app{min-height:100vh}.toast-region{position:fixed;z-index:100;right:20px;bottom:20px;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}

    @keyframes toast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .modal-backdrop{position:fixed;z-index:90;inset:0;background:rgba(14,33,25,.44);display:grid;place-items:center;padding:20px;animation:fade-in 180ms ease both}
    .modal{width:min(520px,100%);max-height:min(88dvh,760px);overflow:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-4);animation:modal-in 260ms var(--ease-out) both}
    @keyframes fade-in{from{opacity:0}to{opacity:1}}@keyframes modal-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
    .modal-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
    .app-shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr);background:#f6f8f7}

    .side-brand{padding:0 9px 22px;border-bottom:1px solid var(--line);margin-bottom:16px}.platform .side-brand{border-color:rgba(255,255,255,.12)}

    .nav-list{display:grid;gap:3px}    .nav-item{height:40px;width:100%;border:0;background:transparent;text-align:left;font-family:inherit;border-radius:9px;padding:0 10px;display:flex;align-items:center;gap:11px;color:#607068;font-size:12px;font-weight:600;cursor:pointer}
    .nav-item:hover{background:var(--e50);color:var(--deep)}.nav-item.active{background:var(--e50);color:var(--deep)}.platform .nav-item:hover,.platform .nav-item.active{background:rgba(255,255,255,.13)}
    .side-bottom{margin-top:auto}.app-main{min-width:0}.app-header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,34px);background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}

    .header-actions{display:flex;align-items:center;gap:9px}.app-content{padding:28px clamp(16px,3vw,34px) 90px;max-width:1500px;margin:auto}

    .stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:17px}.stat-card{padding:18px}.stat-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#67756d}.stat-card strong{display:block;font:750 27px "Plus Jakarta Sans";letter-spacing:-.04em;color:var(--deep);margin-top:9px}
    .content-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,.8fr);gap:16px}.panel{padding:19px}.panel h2{font-size:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}

    .table-toolbar{display:flex;gap:10px;align-items:center;margin:17px 0;flex-wrap:wrap}.table-toolbar .input{max-width:300px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
    table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{padding:12px 14px;background:#f8faf9;color:#748078;font-weight:650;position:sticky;top:0}td{padding:12px 14px;border-top:1px solid #edf1ee;color:#39463f}tbody tr:hover{background:#f8fbf9}

    .login-shell,.center-shell{min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#f4f8f6,#fff 60%,var(--school-tint))}

    }

    function attendanceView(){

      document.querySelectorAll('[data-action="attendance-status"]').forEach(el=>el.addEventListener('click',()=>{if(!can('attendance.write'))return showToast('Your demo role cannot mark attendance.');const id=el.dataset.student;state.attendance[id]=el.dataset.status;document.querySelectorAll('[data-student]').forEach(record=>{if(record.dataset.student!==id)return;record.querySelectorAll('.status-control button').forEach(button=>{const selected=button.dataset.status===el.dataset.status;button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected))})});el.animate?.([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:MOTION.reduced?0:140})}));
      document.querySelectorAll('[data-action="mark-present"]').forEach(el=>el.addEventListener('click',()=>{if(!can('attendance.write'))return showToast('Your demo role cannot mark attendance.');const records=[...document.querySelectorAll('.attendance-row[data-student]')];records.forEach((record,i)=>{state.attendance[record.dataset.student]='Present';setTimeout(()=>document.querySelectorAll('[data-student]').forEach(item=>{if(item.dataset.student===record.dataset.student)item.querySelectorAll('.status-control button').forEach(button=>{const selected=button.dataset.status==='Present';button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected))})}),MOTION.reduced?0:i*30)});showToast('All visible students marked present. Save to apply in the demo.')}));
      document.querySelectorAll('[data-action="save-attendance"]').forEach(el=>el.addEventListener('click',async()=>{if(!can('attendance.write'))return showToast('Your demo role cannot save attendance.');el.disabled=true;el.textContent='Saving…';try{await API.saveAttendance(Object.entries(state.attendance));state.attendanceSaved=true;render();showToast('Attendance saved in this demo session.')}catch(e){el.disabled=false;showToast(e.message)}}));
      document.querySelectorAll('[data-action="pay"]').forEach(el=>el.addEventListener('click',()=>openModal('Demo payment · not connected',`<span class="pill gold">Prototype only</span><div class="stepper"><span class="step-node active">1</span><span class="step-line"></span><span class="step-node">2</span><span class="step-line"></span><span class="step-node">3</span></div><h3>Choose a provider</h3><p class="muted" style="margin-top:8px">Paystack and Flutterwave are not connected in this prototype. No card details are requested.</p><button class="btn btn-primary" data-action="simulate-payment" style="margin-top:12px">Continue demo flow</button><p class="small muted" style="margin-top:12px">Production payments must be verified by a trusted server webhook.</p>`)));
      document.querySelectorAll('[data-action="simulate-payment"]').forEach(el=>el.addEventListener('click',()=>{closeModal();openModal('Awaiting server confirmation',`<span class="pill gold">Demo: simulated confirmation</span><p class="muted" style="margin-top:14px">This is not a payment confirmation. In production, the provider webhook is the source of truth.</p>`)}));
      document.querySelectorAll('[data-action="profile"]').forEach(el=>el.addEventListener('click',()=>{const s=DB.tenants[state.tenantId].students.find(x=>x.id===el.dataset.id);openModal('Student profile',`<span class="pill">Sample profile</span><h3 style="margin-top:12px">${esc(s.name)}</h3><p class="muted">${esc(s.id)} · ${esc(s.className)}</p><div class="notice">Attendance: ${s.attendance}%<br>Fee status: ${esc(s.fee)}</div>${can('student.medical.read')?'<p class="small muted" style="margin-top:12px">Medical and emergency details are intentionally not included in sample records.</p>':'<p class="small muted" style="margin-top:12px">Sensitive student fields are restricted for this role.</p>'}`)}));
      document.querySelectorAll('[data-action="upgrade"]').forEach(el=>el.addEventListener('click',()=>{routeTo('/');setTimeout(()=>document.getElementById('pricing')?.scrollIntoView({behavior:MOTION.reduced?'auto':'smooth'}),100)}))
      document.querySelectorAll('[data-action="download-demo"]').forEach(el=>el.addEventListener('click',()=>showToast('Sample documents are not stored in this prototype.')));
      const msg=document.getElementById('announcement-message');msg?.addEventListener('input',()=>{document.getElementById('char-count').textContent=msg.value.length});
      document.getElementById('announcement-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));if(!can('announcement.publish'))return showToast('Your demo role cannot publish announcements.');if(data.audience==='All families'&&!confirm('This will notify 412 parents in a real deployment. Continue with demo publish?'))return;try{await API.publishAnnouncement(data);showToast('Demo announcement published locally. No notification was sent.');}catch(err){showToast(err.message)}});
      document.getElementById('absence-form')?.addEventListener('submit',async e=>{e.preventDefault();if(!can('absence.write'))return showToast('Your demo role cannot submit absence requests.');await API.submitAbsence(Object.fromEntries(new FormData(e.currentTarget)));showToast('Demo request submitted. No school was notified.')});
      document.getElementById('login-form')?.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget);if(!fd.get('username')||!fd.get('password'))return showToast('Enter both fields to continue.');openModal('Choose a demo role','<p class="muted">This is a prototype role switch, not authentication. Choose a view to explore.</p><div class="nav-list" style="margin-top:14px">'+['School Admin','Teacher','Parent','Student'].map(r=>`<button class="finder-result" data-action="login-role" data-role="${r}"><b>${r}</b>${icon('arrow')}</button>`).join('')+'</div>')});
      document.querySelectorAll('[data-action="login-role"]').forEach(el=>el.addEventListener('click',()=>{state.role=el.dataset.role;closeModal();routeTo(`/app/${parseRoute().tenantId}/overview`)}));
      document.querySelectorAll('[data-action="show-password"]').forEach(el=>el.addEventListener('click',()=>{const input=el.parentElement.querySelector('input');input.type=input.type==='password'?'text':'password';el.textContent=input.type==='password'?'Show':'Hide'}));
      document.querySelectorAll('[data-action="forgot"]').forEach(el=>el.addEventListener('click',()=>openModal('Password help',`<p class="muted">Contact the school directly to reset access. Password reset is not connected in this prototype.</p><a href="mailto:chimdinduvision@gmail.com">Contact support</a>`)));
      document.getElementById('contact-form')?.addEventListener('submit',e=>{e.preventDefault();showToast('Demo enquiry received locally. No email has been sent in prototype mode.');e.currentTarget.reset()});
      document.getElementById('registration-form')?.addEventListener('submit',e=>{e.preventDefault();const form=new FormData(e.currentTarget);Object.assign(state.wizard,Object.fromEntries(form));if(state.wizardStep===3){let code=(state.wizard.code||'').toLowerCase();if(!/^[a-z][a-z0-9-]{2,19}$/.test(code)||['admin','login','support','crestnode'].includes(code)){showToast('Choose an available code: 3–20 letters, digits or hyphens.');return}if(Object.keys(DB.tenants).includes(code)){showToast('That portal code is already in use.');return}state.wizard.code=code}if(state.wizardStep<6){state.wizardStep++;render()}else{openModal('Demo application complete',`<span class="pill success">✓ Details reviewed</span><p class="muted" style="margin-top:13px">Your application preview is complete. Nothing was submitted, saved to a server or approved.</p><a class="btn btn-primary" href="#!/ " data-action="back-home">Back to CrestNode</a>`)}});
      document.querySelectorAll('[data-action="wizard-back"]').forEach(el=>el.addEventListener('click',()=>{state.wizardStep=Math.max(1,state.wizardStep-1);render()}));
      document.querySelectorAll('[data-action="mobile-menu"]').forEach(el=>el.addEventListener('click',()=>openModal('Navigation',`<nav class="nav-list"><a class="nav-item" href="#features">Platform</a><a class="nav-item" href="#how">How it works</a><a class="nav-item" href="#pricing">Plans</a><a class="nav-item" href="#about">About</a><a class="nav-item" href="#contact">Contact</a></nav><a class="btn btn-primary" style="margin-top:14px" href="#/finder">Find my school</a>`)));
      document.querySelectorAll('[data-action="back-home"]').forEach(el=>el.addEventListener('click',()=>closeModal()));
    }
    function debounce(fn,ms){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}}
    function openModal(title,content){priorFocus=document.activeElement;const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2 style="font-size:21px">${esc(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${content}</section></div>`;root.querySelector('[data-action="close-modal"]').addEventListener('click',closeModal);root.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});root.querySelectorAll('[data-action]').forEach(el=>{if(el.dataset.action==='close-modal'||el.dataset.action==='backdrop')return;const cloned=el;cloned.addEventListener('click',()=>{const action=cloned.dataset.action;if(action==='module'){closeModal();goModule(cloned.dataset.module)}else if(action==='switch-tenant'){closeModal();state.tenantId=cloned.dataset.id;routeTo(`/app/${state.tenantId}/overview`)}else if(action==='login-role'){state.role=cloned.dataset.role;closeModal();routeTo(`/app/${parseRoute().tenantId}/overview`)}else if(action==='simulate-payment'){closeModal();openModal('Awaiting server confirmation','<span class="pill gold">Demo: simulated confirmation</span><p class="muted" style="margin-top:14px">Not a verified payment. Production must rely on server-side provider webhooks.</p>')}else if(action==='language'){state.language=({en:'ig',ig:'yo',yo:'ha',ha:'en'})[state.language];closeModal();render()}})});root.querySelector('.modal')?.focus?.();root.querySelector('.modal')?.querySelector('button,a,input')?.focus();document.addEventListener('keydown',modalKey,{once:false});}
    function modalKey(e){if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const items=[...document.querySelectorAll('.modal button:not(:disabled),.modal a[href],.modal input,.modal select,.modal textarea')];if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}
    function closeModal(){document.getElementById('modal-root').innerHTML='';document.removeEventListener('keydown',modalKey);priorFocus?.focus?.();}
    function commandPalette(){const root=document.getElementById('modal-root');root.innerHTML=`<div class="command-backdrop"><div class="command-box" role="dialog" aria-modal="true" aria-label="Command palette"><input id="command-input" placeholder="Search modules and actions…" autocomplete="off"><div id="command-items">${MODULES.map(m=>`<div class="command-item" tabindex="0" data-module="${m}"><span>${esc(appLabel(m))}</span><span class="muted">Open</span></div>`).join('')}<div class="command-item" tabindex="0" data-action="tenant-switch"><span>Switch school</span><span class="muted">Action</span></div></div></div></div>`;root.querySelector('.command-backdrop').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});root.querySelectorAll('.command-item').forEach(el=>el.addEventListener('click',()=>{let module=el.dataset.module;closeModal();module?goModule(module):openModal('Switch school',Object.values(DB.tenants).map(s=>`<button class="finder-result" data-action="switch-tenant" data-id="${s.id}">${esc(s.name)}</button>`).join(''))}));const input=root.querySelector('#command-input');input.focus();input.addEventListener('input',()=>{let q=input.value.toLowerCase();root.querySelectorAll('.command-item').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(q))});input.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter')root.querySelector('.command-item:not([hidden])')?.click()})}
    function exportCSV(){const records=DB.tenants[state.tenantId].students;const lines=[['Student ID','Name','Class','Attendance percent','Fee status'],...records.map(s=>[s.id,s.name,s.className,s.attendance,s.fee])];const csv=lines.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`${state.tenantId}-sample-students.csv`);showToast('Sample CSV downloaded.')}
    function exportICS(){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CrestNode//Demo Calendar//EN',...DB.events.flatMap(e=>{let d=e.date.replaceAll('-','');return ['BEGIN:VEVENT',`UID:${d}-${state.tenantId}@crestnode.demo`,`DTSTAMP:20261018T120000Z`,`DTSTART;VALUE=DATE:${d}`,`SUMMARY:${e.title}`,`DESCRIPTION:Sample event for ${DB.tenants[state.tenantId].name}`,`END:VEVENT`]}),'END:VCALENDAR'];download(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),`${state.tenantId}-sample-calendar.ics`);showToast('Sample calendar file downloaded.')}
    function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    /* INTERACTIONS */
    document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandPalette()}});
    window.addEventListener('hashchange',()=>{if(!document.startViewTransition||MOTION.reduced||transitionBusy){render();return}transitionBusy=true;const transition=document.startViewTransition(render);transition.finished.finally(()=>{transitionBusy=false})});
    /* BOOT */
    render();
  })();
  </script>
</body>
</html>
